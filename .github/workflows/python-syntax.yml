name: Python syntax

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python files
        run: |
          python -m py_compile tiktok_clip_automation.py
          python -m py_compile eskrotos_reel_maker.py
          python -m py_compile subidor_automatico.py
